# Configuración de Streamlit (se copia a la imagen Docker con COPY . .)
[client]
toolbarMode = "viewer"      # oculta el botón "Deploy" y opciones de desarrollador

[browser]
gatherUsageStats = false

# Tema oscuro base: los widgets nativos (sliders, selectbox, tabs) toman estos colores.
# El resto del estilo (tarjetas glass, hero, badges) se inyecta con CSS en app.py.
[theme]
base = "dark"
primaryColor = "#0593C6"              # Sky Blue: sliders, foco, pestaña activa
backgroundColor = "#051923"           # Deep Dark Cyan
secondaryBackgroundColor = "#0B2545"  # Fondo de inputs
textColor = "#FCFFFF"
